name: 추가 스크립트 반영 + 서버 부팅 테스트

on:
  push:
    branches: [main]
    paths:
      - "pack-extra/**"
      - "scripts/tweaks.json"
      - "scripts/boot_test.py"
      - "scripts/client_only.json"
      - ".github/workflows/server-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: packwiz 설치
        run: go install github.com/packwiz/packwiz@latest

      - name: pack-extra와 설정 변경을 팩에 반영
        run: |
          python scripts/apply_tweaks.py pack
          cd pack && packwiz refresh

      - name: 바뀐 팩 커밋
        run: |
          if [ -n "$(git status --porcelain pack)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pack
            git commit -m "추가 스크립트 반영"
            git push
          else
            echo "바뀐 것 없음"
          fi

      - name: 서버 부팅 테스트
        run: python -u scripts/boot_test.py "$RUNNER_TEMP/server"
