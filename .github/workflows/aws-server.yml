name: AWS 서버 켜기·끄기

# 저장소에 쓰기 권한이 있는 사람만 실행할 수 있다 (재현).
# AWS 열쇠는 저장소 Secrets(AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)에 있고,
# IAM 정책상 이 인스턴스 하나만 켜기·끄기·재시작·상태 확인할 수 있다.

on:
  # 매일 자동 켜기 (일본 시간 16:53, 17:17, 17:33, 17:47 중 먼저 실행되는 것이 켬, 나머지는 "이미 켜져 있음")
  # GitHub 예약은 정각·30분에 몰려서 늦거나 빠지는 일이 있어 어중간한 분으로 여러 번.
  # server-control/schedule.json의 enabled가 false면 건너뜀. 끄기는 서버가 스스로 함 (valley_countdown.py)
  schedule:
    - cron: "53 7 * * *"
    - cron: "17 8 * * *"
    - cron: "33 8 * * *"
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: 할 일
        required: true
        type: choice
        options: [status, start, stop, reboot, logs, shell]
        default: status
      cmd:
        description: shell일 때 서버에서 실행할 명령
        required: false
        type: string

concurrency:
  group: aws-server
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_DEFAULT_REGION: ap-northeast-2
  INSTANCE_ID: i-0c36cc5a227308e18
  SERVER_IP: 43.202.127.139
  MC_PORT: "25565"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 할 일 실행
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ACTION: ${{ inputs.action || 'start' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          CMD: ${{ inputs.cmd }}
        run: |
          set -euo pipefail
          state() {
            aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' --output text
          }
          mc_up() { timeout 3 bash -c "</dev/tcp/$SERVER_IP/$MC_PORT" 2>/dev/null; }

          # 서버 안에서 명령 실행 (AWS SSM, 인스턴스에 SSM 역할이 붙어 있어야 함)
          remote() {
            local script="$1"
            local params
            params=$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":["120"]}))' "$script")
            local cid
            cid=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
              --parameters "$params" --query Command.CommandId --output text)
            aws ssm wait command-executed --command-id "$cid" --instance-id "$INSTANCE_ID" || true
            aws ssm get-command-invocation --command-id "$cid" --instance-id "$INSTANCE_ID" \
              --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          }

          echo "현재 상태: $(state)"
          if [ "$SCHEDULED" = "true" ]; then
            if [ "$(python3 -c 'import json;print(json.load(open("server-control/schedule.json")).get("enabled", False))')" != "True" ]; then
              echo "RESULT: 자동 켜기 꺼져 있음 (schedule.json)"; exit 0
            fi
            if [ "$(state)" = "running" ] && mc_up; then echo "RESULT: 이미 켜져 있음"; exit 0; fi
          fi
          case "$ACTION" in
            start)
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              echo "인스턴스 켜짐. 마인크래프트 서버 응답 기다리는 중 (최대 10분)"
              for i in $(seq 1 60); do
                if mc_up; then echo "RESULT: 서버 열림 ($SERVER_IP:$MC_PORT)"; exit 0; fi
                sleep 10
              done
              echo "RESULT: 인스턴스는 켜졌지만 10분 안에 마인크래프트 포트가 열리지 않음"
              ;;
            stop)
              aws ec2 stop-instances --instance-ids "$INSTANCE_ID" >/dev/null
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              echo "RESULT: 서버 꺼짐"
              ;;
            reboot)
              aws ec2 reboot-instances --instance-ids "$INSTANCE_ID"
              echo "RESULT: 재시작 요청함"
              ;;
            status)
              s=$(state)
              if [ "$s" = "running" ] && mc_up; then
                echo "RESULT: 켜져 있음, 마인크래프트 서버 응답함"
                echo "PLAYERS: $(python3 scripts/mc_ping.py "$SERVER_IP" "$MC_PORT" 2>&1 | tail -1)"
              else
                echo "RESULT: 인스턴스 상태 $s, 마인크래프트 서버 $(mc_up && echo 응답함 || echo 응답 없음)"
              fi
              ;;
            logs)
              remote 'L=/opt/valley/server/logs/latest.log
          echo "=== 디스크 / 메모리 ==="; df -h /opt/valley | tail -1; free -h | sed -n 2p
          echo "=== 서버 TPS·렉 경고 ==="; grep -c "Can.t keep up" $L | sed "s/^/렉 경고 횟수: /"; grep "Can.t keep up" $L | tail -3
          echo "=== 접속 기록 (이번 실행) ==="; grep -E "joined the game|left the game" $L | tail -40
          echo "=== 오류 (TheValley·KubeJS) ==="; grep -E "ERROR|\[TheValley\].*(error|실패)" $L | grep -v "^\s*at " | tail -30
          echo "=== 마지막 40줄 ==="; tail -40 $L
          echo "=== 이전 실행 접속 기록 ==="; for f in $(ls -t /opt/valley/server/logs/*.log.gz 2>/dev/null | head -5); do echo "-- $f"; zcat $f | grep -E "joined the game|left the game" | tail -20; done'
              ;;
            shell)
              remote "$CMD"
              ;;
          esac
